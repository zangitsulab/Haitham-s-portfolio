<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Article | Haitham</title>
  <meta
    name="description"
    content="Medical, scientific and research writing by Haitham."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="nav">
    <a class="brand" href="index.html">
      <span>Haitham</span>
    </a>

    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#articles">Articles</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>

    <div class="nav-actions">
      <button class="avatar" aria-label="Haitham">H</button>
    </div>
  </header>


  <main class="article-page">

    <div class="article-back">
      <a href="index.html#articles">← Back to Articles</a>
    </div>

    <article id="articleContainer">

      <div class="article-loading">
        Loading article...
      </div>

    </article>

  </main>


  <footer>
    <p>© 2026 Haitham. All rights reserved.</p>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const articleContainer = document.getElementById("articleContainer");

    const params = new URLSearchParams(window.location.search);
    const articleId = params.get("id");

    async function loadArticle() {

      if (!articleId) {
        articleContainer.innerHTML = `
          <div class="article-error">
            <h1>Article not found</h1>
            <p>No article was specified.</p>
            <a href="index.html#articles">Return to Articles</a>
          </div>
        `;
        return;
      }

      const { data: article, error } = await supabaseClient
        .from("articles")
        .select("*")
        .eq("id", articleId)
        .eq("published", true)
        .single();

      if (error || !article) {
        articleContainer.innerHTML = `
          <div class="article-error">
            <h1>Article not found</h1>
            <p>This article may not exist or may not be published.</p>
            <a href="index.html#articles">Return to Articles</a>
          </div>
        `;
        return;
      }

      document.title = `${article.title} | Haitham`;

      articleContainer.innerHTML = `
        <header class="article-header">

          <span class="eyebrow">ARTICLE</span>

          <h1>${escapeHTML(article.title)}</h1>

          ${
            article.description
              ? `<p class="article-description">
                  ${escapeHTML(article.description)}
                </p>`
              : ""
          }

          <div class="article-meta">
            <span>
              ${formatDate(article.created_at)}
            </span>

            ${
              article.featured
                ? `<span class="article-featured">Featured</span>`
                : ""
            }
          </div>

        </header>


        ${
          article.image_url
            ? `
              <div class="article-cover">
                <img
                  src="${escapeAttribute(article.image_url)}"
                  alt="${escapeAttribute(article.title)}"
                >
              </div>
            `
            : ""
        }


        <div class="article-content">
          ${formatContent(article.content)}
        </div>


        ${
          article.publication_url
            ? `
              <div class="article-source">
                <span class="eyebrow">PUBLISHED ELSEWHERE</span>

                <p>
                  This article was also published or reviewed externally.
                </p>

                <a
                  href="${escapeAttribute(article.publication_url)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Read the publication →
                </a>
              </div>
            `
            : ""
        }

      `;
    }


    function formatContent(content) {
      if (!content) {
        return "<p>No content available.</p>";
      }

      return escapeHTML(content)
        .split(/\n\s*\n/)
        .map(paragraph => `<p>${paragraph.replace(/\n/g, "<br>")}</p>`)
        .join("");
    }


    function formatDate(date) {
      if (!date) return "";

      return new Date(date).toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }


    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }


    function escapeAttribute(value) {
      return escapeHTML(value);
    }


    loadArticle();
  </script>

</body>
</html>
